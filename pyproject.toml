[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fabric-onelake-governance"
version = "0.1.0"
description = "Policy-as-code assessment and safe remediation for Microsoft Fabric OneLake catalog governance"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Reg Shih" }]
dependencies = [
  "azure-identity>=1.19,<2",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
onelake-governance = "onelake_governance.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"demo/notebooks/*.py" = ["E402", "F821"]
"tools/security_scan.py" = ["S603", "S607"]
